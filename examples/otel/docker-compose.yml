# NooblyJS with traces and metrics sent over OTLP to an OpenTelemetry Collector,
# which forwards traces to Jaeger. Open http://localhost:16686 after a few requests.
#
#   cd examples/otel && docker compose up --build
#
# Replace SESSION_SECRET and API_KEYS before using this outside your machine.
services:
  app:
    build:
      context: ../..
      dockerfile: examples/otel/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "9000"
      SESSION_SECRET: change-me-to-a-long-random-string-of-32+chars
      API_KEYS: change-me-api-key
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: nooblyjs-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_ENABLED: "true"
      OTEL_METRICS_EXPORT_INTERVAL_MS: "10000"
    ports:
      - "9000:9000"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
