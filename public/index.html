<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">NooblyJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui.css">
    <link rel="icon" type="image/jpeg" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
    <link rel="stylesheet" href="/services/css/public-home.css">
</head>
<body class="loading wiki-page">
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner">
                <div class="inline-48449860 spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <p class="loading-text">Loading page content...</p>
        </div>
    </div>

    <!-- Content Frame Wrapper -->
    <div class="content-frame">
        <!-- Header (dynamically generated from markdown) -->
        <div id="header-container"></div>

        <!-- Dynamic Content Sections -->
        <div id="dynamic-sections">
            <!-- All content sections will be rendered here dynamically from content.json -->
        </div>

        <!-- Footer (dynamically generated from markdown) -->
        <div id="footer-container"></div>
    </div>

    <!-- Document Viewer Modal -->
    <div id="document-modal" class="inline-f2892a2e document-modal">
        <div class="document-modal-content">
            <button class="document-modal-close" id="doc-close-btn">&times;</button>
            <div class="document-modal-header">
                <h2 id="doc-viewer-title" class="mb-0">Loading...</h2>
            </div>
            <div class="document-modal-body" id="doc-viewer-content">
                <!-- Markdown content will be rendered here -->
            </div>
        </div>
    </div>

    <script src="./js/home-content.js"></script>

    <!-- Bootstrap 5 JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Mermaid.js for diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="./js/home-init.js"></script>

    <!-- Swagger UI for API documentation -->
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>
    <!-- JS-YAML for parsing YAML in swagger blocks -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml/dist/js-yaml.min.js"></script>

    <!-- Custom Markdown Parser with support for container and hero-banner blocks -->
    <script src="./js/markdown-parser.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4QK5BHJYZM"></script>
    <script src="./js/home-analytics.js"></script>
</body>
</html>
