name: Release

# Publishes to npm with provenance and attaches a CycloneDX SBOM to the GitHub
# release (feature 20b).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Production audit gate
        run: npm audit --omit=dev --audit-level=high
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@1 --omit dev --output-file sbom.cdx.json
      - name: Attach SBOM to the release
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
