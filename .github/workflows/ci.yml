# NooblyJS Core — CI gate (N-1 / P0-6).
# Runs unit tests with a coverage threshold, Playwright UI tests, a production
# dependency audit, a Docker build with a live security probe and a ZAP
# baseline scan, and a gitleaks secret scan on every push and pull request.
# To block merges on failure, mark these jobs as required status checks in the
# repository's branch protection settings.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # Feature 06: the reliable-jobs contract also runs against a real Redis.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type checks (public types, nooblyjs-ai-common)
        run: npm run check:types && npm run check:ai-common
      - name: nooblyjs-ai-common tests
        run: npm run test:ai-common
      - name: Jest with coverage threshold
        run: npm run coverage
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .temp/coverage
          retention-days: 14

  ui:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .temp/tests/playwright
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: No high/critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t nooblyjs-core:ci .
      - name: Refuses to start without secrets
        run: |
          if timeout 30 docker run --rm nooblyjs-core:ci; then
            echo "Container started without SESSION_SECRET/API keys" && exit 1
          fi
      - name: Becomes healthy with secrets
        run: |
          docker run -d --name app -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e API_KEYS="$(openssl rand -hex 32)" nooblyjs-core:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker logs app
          exit 1
      # Feature 22: the live security probe against the production image.
      - name: Security probe
        run: |
          docker rm -f app
          KEY="$(openssl rand -hex 32)"
          ADMIN_KEY="$(openssl rand -hex 32)"
          docker run -d --name app -p 9000:9000 -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e API_KEYS="$KEY" -e ADMIN_API_KEYS="$ADMIN_KEY" nooblyjs-core:ci
          for i in $(seq 1 30); do curl -sf http://localhost:9000/health/live >/dev/null && break; sleep 2; done
          node scripts/probe.js --url http://localhost:9000 --api-key "$ADMIN_KEY" --data-key "$KEY" --invasive
      # Feature 22: OWASP ZAP passive baseline scan; rules in .zap/rules.tsv
      # decide which alerts fail the build (-I: warnings never do).
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap && cp .zap/rules.tsv zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:9000/services/authservice/views/login.html \
            -c rules.tsv -I -r zap-report.html -J zap-report.json
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/zap-report.*
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Findings already in history are listed (redacted) in
      # .gitleaks-baseline.json; any new one fails the build.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo \
            --redact --no-banner --baseline-path /repo/.gitleaks-baseline.json
