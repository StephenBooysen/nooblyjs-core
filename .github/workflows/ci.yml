# NooblyJS Core — CI gate (N-1 / P0-6).
# Runs unit tests with a coverage threshold, Playwright UI tests, a production
# dependency audit and a Docker build on every push and pull request.
# To block merges on failure, mark these jobs as required status checks in the
# repository's branch protection settings.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type-check the declarations and usage examples
        run: npm run check:types
      - name: Jest with coverage threshold
        run: npm run coverage
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .temp/coverage
          retention-days: 14

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the working tree
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --no-git --config /repo/.gitleaks.toml --redact --exit-code 1

  zap:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start the app without login (test mode)
        run: |
          mkdir -p .temp/tests/zap && chmod 777 .temp/tests/zap
          PORT=11100 ALLOW_NOAUTH=1 NODE_ENV=test nohup node app-noauth.js > .temp/tests/zap/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:11100/services/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:11100/services/
      - name: ZAP baseline (fails on high-risk alerts)
        run: |
          docker run --rm --network host -v "$PWD/.temp/tests/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:11100/services/ -r zap-report.html -J zap-report.json -I -m 3
      - name: Upload the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: .temp/tests/zap
          retention-days: 14

  contracts-redis:
    name: Provider contracts against Redis (Node 24)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Caching and queueing contracts against a live Redis
        env:
          RUN_REDIS_TESTS: '1'
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:contract

  ui:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .temp/tests/playwright
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: No high/critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t nooblyjs-core:ci .
      - name: Refuses to start without secrets
        run: |
          if timeout 30 docker run --rm nooblyjs-core:ci; then
            echo "Container started without SESSION_SECRET/API keys" && exit 1
          fi
      - name: Becomes healthy with secrets
        run: |
          docker run -d --name app -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e API_KEYS="$(openssl rand -hex 32)" nooblyjs-core:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker logs app
          exit 1
