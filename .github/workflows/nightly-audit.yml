name: Nightly dependency audit

# Runs the production audit every night on main and opens an issue when a high
# or critical advisory is found (feature 20b).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Production audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        id: audit
        run: |
          if npm audit --omit=dev --audit-level=high > audit.txt 2>&1; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          cat audit.txt
      - name: Open or update an issue on failure
        if: steps.audit.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('audit.txt', 'utf8').slice(-20000);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'security-audit';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label
            });
            const text = `Nightly \`npm audit --omit=dev --audit-level=high\` failed.\n\nRun: ${runUrl}\n\n\`\`\`\n${body}\n\`\`\``;
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body: text });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Nightly audit: high or critical advisory in production dependencies',
                labels: [label],
                body: text
              });
            }
            core.setFailed('Production audit found high or critical advisories');
