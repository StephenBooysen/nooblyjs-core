# NooblyJS Core — nightly dependency audit (feature 20b).
# New advisories are published against existing dependencies without any code
# change, so the push/PR gate alone misses them (H-2, 2026-11-12). This job
# audits main every night and opens (or comments on) one issue when it fails.
name: Nightly audit

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Audit production dependencies
        id: audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1
          status=$?
          cat audit.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or update the audit issue
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly audit: high or critical advisories in production dependencies"
          {
            echo "\`npm audit --omit=dev --audit-level=high\` failed on \`main\` ($(date -u +%F))."
            echo
            echo '```'
            tail -n 80 audit.txt
            echo '```'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          number=$(gh issue list --state open --label security --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh label create security --color B60205 --description "Security issue" 2>/dev/null || true
            gh issue create --title "$title" --label security --body-file body.md
          fi
      - name: Fail the run
        if: steps.audit.outputs.status != '0'
        run: exit 1
