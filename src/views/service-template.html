<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[SERVICE_TITLE]] - NooblyJS Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/services/js/actions.js"></script>
</head>
<body data-service-name="[[SERVICE_NAME]]">
<div class="core-app">
    <!-- Topbar -->
    <header class="navbar core-topbar">
        <div class="core-brand">
            <div class="logo">NJS</div>
            <div class="name">[[SERVICE_TITLE]]<small>Core</small></div>
        </div>
        <div class="core-search">
            <div class="wrap">
                <i class="bi bi-search"></i>
                <input placeholder="Search…">
            </div>
        </div>
        <div class="core-topbar-actions">
            <button class="core-icon-btn" title="Back" data-onclick="navigateTo" data-onclick-args="[&quot;/services/&quot;]"><i class="bi bi-house-door"></i></button>
            <button class="core-icon-btn" title="Help"><i class="bi bi-question-circle"></i></button>
            <div class="core-user">
                <span id="headerUserName">User</span>
                <div class="av" id="headerUserAvatar">U</div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="core-sidebar" id="navigation-sidebar">
        <!-- Navigation will be populated by navigation.js -->
    </aside>

    <!-- Main Content -->
    <main class="core-main">
        <!-- Page Title -->
        <div class="inline-b75fad00 core-page-hero">
            <h1>[[SERVICE_TITLE]]</h1>
            <p>[[SERVICE_SUBTITLE]]</p>
        </div>

        <!-- Alerts -->
        <div class="inline-f2892a2e alert alert-success alert-dismissible fade" id="successAlert" role="alert">
            <strong>Success!</strong> <span id="successMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="inline-f2892a2e alert alert-danger alert-dismissible fade" id="errorAlert" role="alert">
            <strong>Error!</strong> <span id="errorMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Instance Selector (if applicable) -->
        <div class="inline-3fb21d03" id="instanceSelectorContainer">
            <div>
                <label for="instanceSelector" class="inline-14391d16">Instance:</label>
                <select id="instanceSelector" class="inline-f6f7779b">
                    <option value="default">default</option>
                </select>
            </div>
            <button id="refreshInstanceBtn" class="btn btn-outline-primary" title="Refresh instances list">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>

        <!-- Tabs -->
        <div class="core-tabs">
            <div class="tab-strip">
                <button class="tab-btn active" data-bs-toggle="tab" data-bs-target="#dashboard" role="tab">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </button>
                <button class="tab-btn" data-bs-toggle="tab" data-bs-target="#data" role="tab">
                    <i class="bi bi-database"></i> Data
                </button>
                <button class="tab-btn" data-bs-toggle="tab" data-bs-target="#settings" role="tab">
                    <i class="bi bi-gear"></i> Settings
                </button>
            </div>

            <!-- Tab Content -->
            <div class="tab-pane active" id="dashboard" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h3>Dashboard</h3>
                    </div>
                    <div class="card-body p-3">
                        <p class="inline-3b2ea3de">Dashboard content will be populated by service-specific script</p>
                    </div>
                </div>
            </div>

            <div class="tab-pane" id="data" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h3>Data Operations</h3>
                    </div>
                    <div class="card-body p-3">
                        <p class="inline-3b2ea3de">Data content will be populated by service-specific script</p>
                    </div>
                </div>
            </div>

            <div class="inline-3ea6f166 tab-pane" id="settings" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h3>Service Settings</h3>
                    </div>
                    <div class="card-body p-3">
                        <form id="settingsForm">
                            <div id="settingsFormFields"></div>
                            <div class="inline-73d91423">
                                <button type="submit" class="btn btn-primary">Save Settings</button>
                                <button type="button" class="btn btn-outline-primary" data-onclick="loadSettings" data-onclick-args="[]">Reload</button>
                            </div>
                        </form>
                        <div id="settingsSaveResponse" class="inline-5a89b13a">
                            <div class="inline-512f7b38">Save Response:</div>
                            <div id="settingsSaveResponseContent" class="inline-4b92dd90"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-bundle.js"></script>
    <script src="/services/js/navigation.js"></script>

    <script src="/services/js/service-template.js"></script>
</body>
</html>
