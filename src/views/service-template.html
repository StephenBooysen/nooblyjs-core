<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[SERVICE_TITLE]] - NooblyJS Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/services/js/csp-actions.js"></script>
</head>
<body>
<div class="core-app">
    <!-- Topbar -->
    <header class="navbar core-topbar">
        <div class="core-brand">
            <div class="logo">NJS</div>
            <div class="name">[[SERVICE_TITLE]]<small>Core</small></div>
        </div>
        <div class="core-search">
            <div class="wrap">
                <i class="bi bi-search"></i>
                <input placeholder="Search…">
            </div>
        </div>
        <div class="core-topbar-actions">
            <button class="core-icon-btn" title="Back" data-href="/services/"><i class="bi bi-house-door"></i></button>
            <button class="core-icon-btn" title="Help"><i class="bi bi-question-circle"></i></button>
            <div class="core-user">
                <span id="headerUserName">User</span>
                <div class="av" id="headerUserAvatar">U</div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="core-sidebar" id="navigation-sidebar">
        <!-- Navigation will be populated by navigation.js -->
    </aside>

    <!-- Main Content -->
    <main class="core-main">
        <!-- Page Title -->
        <div class="core-page-hero" style="margin-bottom: 20px;">
            <h1>[[SERVICE_TITLE]]</h1>
            <p>[[SERVICE_SUBTITLE]]</p>
        </div>

        <!-- Alerts -->
        <div class="alert alert-success alert-dismissible fade" id="successAlert" role="alert" style="display: none;">
            <strong>Success!</strong> <span id="successMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="alert alert-danger alert-dismissible fade" id="errorAlert" role="alert" style="display: none;">
            <strong>Error!</strong> <span id="errorMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Instance Selector (if applicable) -->
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; margin-bottom: 1.5rem;" id="instanceSelectorContainer" style="display: none;">
            <div>
                <label for="instanceSelector" style="margin-right: 8px; font-weight: 500;">Instance:</label>
                <select id="instanceSelector" style="width: 200px; display: inline-block; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
                    <option value="default">default</option>
                </select>
            </div>
            <button id="refreshInstanceBtn" class="btn btn-outline-primary" title="Refresh instances list">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>

        <!-- Tabs -->
        <div class="core-tabs">
            <div class="tab-strip">
                <button class="tab-btn active" data-bs-toggle="tab" data-bs-target="#dashboard" role="tab">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </button>
                <button class="tab-btn" data-bs-toggle="tab" data-bs-target="#data" role="tab">
                    <i class="bi bi-database"></i> Data
                </button>
                <button class="tab-btn" data-bs-toggle="tab" data-bs-target="#settings" role="tab">
                    <i class="bi bi-gear"></i> Settings
                </button>
            </div>

            <!-- Tab Content -->
            <div class="tab-pane active" id="dashboard" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h3>Dashboard</h3>
                    </div>
                    <div class="card-body p-3">
                        <p style="color: var(--muted);">Dashboard content will be populated by service-specific script</p>
                    </div>
                </div>
            </div>

            <div class="tab-pane" id="data" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h3>Data Operations</h3>
                    </div>
                    <div class="card-body p-3">
                        <p style="color: var(--muted);">Data content will be populated by service-specific script</p>
                    </div>
                </div>
            </div>

            <div class="tab-pane" id="settings" role="tabpanel" style="min-height:1000px">
                <div class="card">
                    <div class="card-header">
                        <h3>Service Settings</h3>
                    </div>
                    <div class="card-body p-3">
                        <form id="settingsForm">
                            <div id="settingsFormFields"></div>
                            <div style="margin-top: 20px; display: flex; gap: 10px;">
                                <button type="submit" class="btn btn-primary">Save Settings</button>
                                <button type="button" class="btn btn-outline-primary" data-onclick="loadSettings">Reload</button>
                            </div>
                        </form>
                        <div id="settingsSaveResponse" style="display: none; margin-top: 1rem;">
                            <div style="font-weight: 600; margin-bottom: 8px;">Save Response:</div>
                            <div id="settingsSaveResponseContent" style="background: var(--surface-sunken); padding: 12px; border-radius: 8px; font-size: 12px; color: var(--ink-2); overflow-x: auto; max-height: 200px; overflow-y: auto; font-family: 'JetBrains Mono', monospace;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-bundle.js"></script>
    <script src="/services/js/navigation.js"></script>

    <script src="/services/service-template.page-1.js"></script>
</body>
</html>
