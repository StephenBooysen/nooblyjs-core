<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Access Denied - NooblyJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
        <link rel="stylesheet" href="/services/css/auth-invalid.css">
    <script src="/services/js/actions.js"></script>
</head>
<body>
    <div class="auth-container d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="card auth-card">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <div id="logo-container" class="mb-3">
                                    <img src="/images/nooblyjs-logo.png" alt="NooblyJS Logo" class="inline-573cce16">
                                    <div class="auth-logo" id="app-name">NooblyJS</div>
                                </div>
                            </div>

                            <div class="text-center mb-4">
                                <i class="bi bi-shield-lock icon-lock"></i>
                                <h4 class="text-danger fw-bold mb-3">Access Restricted</h4>
                                <div class="alert-message">
                                    <strong>Insufficient Privileges</strong>
                                    You don't have the required Administrator role to access the Services Portal.
                                    Please contact your system administrator if you believe this is an error.
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary" data-onclick="signOut" data-onclick-args="[]">Sign Out</button>
                                <a href="/services/authservice/views/login.html" class="btn btn-outline-secondary mt-2">Return to Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/invalid.page.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
