<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Access Denied - NooblyJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
    <style>
        /* Restore 12px base font: this page is sized in rem against a 12px root
           (previously provided by public/styles.css before the CSS consolidation). */
        html { font-size: 12px; }
        :root {
            --custom-primary: var(--accent);
            --custom-secondary: var(--muted);
            --custom-warning: var(--warn-border);
        }

        body.loading {
            opacity: 0;
        }

        body {
            opacity: 1;
            transition: opacity 0.3s ease-in;
        }

        .auth-container {
            min-height: 100vh;
        }

        .auth-card {
            max-width: 360px;
            width: 100%;
            aspect-ratio: 0.75;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card .card-body {
            padding: 1.5rem !important;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .auth-card .text-center {
            margin-bottom: 1rem !important;
        }

        .auth-card .text-center img {
            max-height: 60px !important;
            margin-bottom: 0.5rem !important;
        }

        .auth-card .text-center p {
            font-size: 0.875rem;
            margin: 0.5rem 0 0 0;
        }

        .icon-lock {
            font-size: 3rem;
            color: var(--danger);
            margin-bottom: 0.75rem;
        }

        .alert-message {
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            color: var(--muted);
        }

        .alert-message strong {
            color: var(--accent);
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .auth-card .btn {
            font-size: 0.875rem;
            padding: 0.5rem 1rem !important;
        }
    </style>
    <script src="/services/js/csp-actions.js"></script>
</head>
<body>
    <div class="auth-container d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="card auth-card">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <div id="logo-container" class="mb-3">
                                    <img src="/images/nooblyjs-logo.png" alt="NooblyJS Logo" style="max-height: 80px; width: auto; margin-bottom: 1rem;">
                                    <div class="auth-logo" id="app-name">NooblyJS</div>
                                </div>
                            </div>

                            <div class="text-center mb-4">
                                <i class="bi bi-shield-lock icon-lock"></i>
                                <h4 class="text-danger fw-bold mb-3">Access Restricted</h4>
                                <div class="alert-message">
                                    <strong>Insufficient Privileges</strong>
                                    You don't have the required Administrator role to access the Services Portal.
                                    Please contact your system administrator if you believe this is an error.
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary" data-onclick="signOut">Sign Out</button>
                                <a href="/services/authservice/views/login.html" class="btn btn-outline-secondary mt-2">Return to Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/services/authservice/views/invalid.page-1.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
