<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Login - NooblyJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
    <style>
        /* Restore 12px base font: this page is sized in rem against a 12px root
           (previously provided by public/styles.css before the CSS consolidation). */
        html { font-size: 12px; }
        :root {
            --custom-primary: var(--accent);
            --custom-secondary: var(--muted);
            --custom-warning: var(--warn-border);
        }

        body.loading {
            opacity: 0;
        }

        body {
            opacity: 1;
            transition: opacity 0.3s ease-in;
        }

        .auth-container {
            min-height: 100vh;
        }
        .auth-card {
            max-width: 360px;
            width: 100%;
            aspect-ratio: 0.75;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card .card-body {
            padding: 1.5rem !important;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .auth-card .text-center {
            margin-bottom: 1rem !important;
        }
        .auth-card .text-center img {
            max-height: 60px !important;
            margin-bottom: 0.5rem !important;
        }
        .auth-card .text-center p {
            font-size: 1.2rem;
            margin: 0.5rem 0 0 0;
        }
        .auth-card .mb-3 {
            margin-bottom: 0.75rem !important;
        }
        .auth-card .mb-4 {
            margin-bottom: 0.75rem !important;
        }
        .auth-card .form-label {
            font-size: 1.2rem;
            margin-bottom: 0.25rem !important;
        }
        .auth-card .form-control {
            font-size: 1.2rem;
            padding: 0.4rem 0.75rem !important;
        }
        .auth-card .btn {
            font-size: 1.2rem;
            padding: 0.5rem 1rem !important;
        }
    </style>
</head>
<body>
    <div class="auth-container d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="card auth-card">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <div id="logo-container" class="mb-3">
                                    <img src="/images/nooblyjs-logo.png" alt="NooblyJS Logo" style="max-height: 80px; width: auto; margin-bottom: 1rem;">
                                    <div class="auth-logo" id="app-name">NooblyJS</div>
                                </div>
                                <p class="text-muted">Welcome back! Please sign in to your account.</p>
                            </div>

                            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                            <div id="success-message" class="alert alert-success d-none" role="alert"></div>
                            <div id="checking-auth" class="text-center d-none">
                                <div class="spinner-border text-primary mb-3" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="text-muted">Checking authentication...</p>
                            </div>

                            <form id="login-form" class="d-none">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">Email</label>
                                    <input type="email" id="email" name="email" class="form-control" required>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label fw-semibold">Password</label>
                                    <input type="password" id="password" name="password" class="form-control" required>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="login-btn">
                                    Sign In
                                </button>
                            </form>

                            <div id="login-actions" class="text-center d-none">
                                <div class="mb-3">
                                    <p class="mb-2 text-muted">Don't have an account?</p>
                                    <a href="/services/authservice/views/request-invitation.html" class="btn btn-outline-primary w-100">Create New Account</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/services/authservice/views/login.page-1.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
