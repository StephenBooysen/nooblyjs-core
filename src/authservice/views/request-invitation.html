<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Request Invitation - NooblyJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
        <link rel="stylesheet" href="/services/css/auth-request-invitation.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="card-body">
                <!-- Form Section -->
                <div id="formSection">
                    <div class="text-center mb-4">
                        <img src="/images/nooblyjs-logo.png" alt="NooblyJS Logo" class="inline-5efd034f">
                        <div class="auth-logo" id="app-name">NooblyJS</div>
                        <p>Request an invitation to create your account</p>
                    </div>

                    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="invitationForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" name="fullName" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="mobile" class="form-label">Mobile Number <span class="text-muted">(optional)</span></label>
                            <input type="tel" class="form-control" id="mobile" name="mobile" placeholder="+1 (555) 123-4567">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="submitBtn">
                            Request Invitation
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0">Already have an invitation? <a href="#" id="redeemLink" class="auth-link fw-semibold">Redeem here</a></p>
                    </div>
                </div>

                <!-- Success Section -->
                <div id="successSection" class="d-none">
                    <div class="success-message">
                        <i class="bi bi-check-circle"></i>
                        <h3>Invitation Ready!</h3>
                        <p class="text-muted mb-3">Save this code — you'll need it to create your account.</p>

                        <div class="invitation-code">
                            <div class="invitation-code-label">Your Invitation Code</div>
                            <div class="invitation-code-value" id="invitationCode"></div>
                            <button type="button" class="btn btn-sm btn-outline-secondary copy-btn" id="copyCodeBtn">
                                <i class="bi bi-clipboard"></i> Copy Code
                            </button>
                        </div>

                        <a href="#" id="redeemNowBtn" class="btn btn-primary w-100 mt-2">
                            Redeem Now
                        </a>

                        <p class="text-muted small mt-3">
                            Or visit the <a href="#" id="redeemPageLink" class="auth-link">redemption page</a> later. Code expires in 7 days.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/request-invitation.page.js"></script>
</body>
</html>
