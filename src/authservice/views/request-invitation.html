<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Request Invitation - NooblyJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
    <style>
        /* Restore 12px base font: this page is sized in rem against a 12px root
           (previously provided by public/styles.css before the CSS consolidation). */
        html { font-size: 12px; }
        :root {
            --custom-primary: var(--accent);
            --custom-secondary: var(--muted);
            --custom-warning: var(--warn-border);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            max-width: 500px;
            width: 100%;
            padding: 1rem;
        }

        .auth-card .card-body {
            padding: 2.5rem 2rem;
        }

        .auth-card .text-center p {
            font-size: 1.2rem;
            color: var(--muted);
            margin-bottom: 0;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .auth-card .form-control {
            font-size: 1.2rem;
            padding: 0.4rem 0.75rem;
        }

        .auth-card .btn {
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
        }

        .invitation-code {
            background: var(--surface-sunken);
            border: 2px dashed var(--custom-primary);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
        }

        .invitation-code-label {
            font-size: 1.2rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        .invitation-code-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--custom-primary);
            font-family: monospace;
            word-break: break-all;
        }

        .copy-btn {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="card-body">
                <!-- Form Section -->
                <div id="formSection">
                    <div class="text-center mb-4">
                        <img src="/images/nooblyjs-logo.png" alt="NooblyJS Logo" style="max-height: 60px; width: auto; margin-bottom: 1rem;">
                        <div class="auth-logo" id="app-name">NooblyJS</div>
                        <p>Request an invitation to create your account</p>
                    </div>

                    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="invitationForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" name="fullName" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="mobile" class="form-label">Mobile Number <span class="text-muted">(optional)</span></label>
                            <input type="tel" class="form-control" id="mobile" name="mobile" placeholder="+1 (555) 123-4567">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="submitBtn">
                            Request Invitation
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0">Already have an invitation? <a href="#" id="redeemLink" class="auth-link fw-semibold">Redeem here</a></p>
                    </div>
                </div>

                <!-- Success Section -->
                <div id="successSection" class="d-none">
                    <div class="success-message">
                        <i class="bi bi-check-circle"></i>
                        <h3 id="successTitle">Invitation Ready!</h3>
                        <p class="text-muted mb-3" id="successMessage">Save this code — you'll need it to create your account.</p>

                        <div class="invitation-code" id="codeBlock">
                            <div class="invitation-code-label">Your Invitation Code</div>
                            <div class="invitation-code-value" id="invitationCode"></div>
                            <button type="button" class="btn btn-sm btn-outline-secondary copy-btn" id="copyCodeBtn">
                                <i class="bi bi-clipboard"></i> Copy Code
                            </button>
                        </div>

                        <a href="#" id="redeemNowBtn" class="btn btn-primary w-100 mt-2">
                            Redeem Now
                        </a>

                        <p class="text-muted small mt-3">
                            Or visit the <a href="#" id="redeemPageLink" class="auth-link">redemption page</a> later. Code expires in 7 days.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/services/authservice/views/request-invitation.page-1.js"></script>
</body>
</html>
